<svg width="600" height="180" viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="premiumGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <filter id="vectorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sharp Geometric 'P' Icon -->
  <g transform="translate(65, 90)">
    <!-- Rear Angular Fragment -->
    <path d="M-40 -45 L-5 -45 L-5 45 L-40 45 Z" fill="url(#premiumGold)" opacity="0.2" transform="skewX(-15)" />
    <!-- Loop Fragment -->
    <path d="M-15 -35 L15 -35 C40 -35 40 10 15 10 L-15 10 Z" fill="url(#premiumGold)" filter="url(#vectorGlow)" />
    <!-- Center Column -->
    <path d="M-15 -50 L5 -50 L5 50 L-15 50 Z" fill="url(#premiumGold)" filter="url(#vectorGlow)" />
    <!-- High-end Accents -->
    <circle cx="20" cy="-35" r="3.5" fill="#FFF" filter="url(#vectorGlow)" />
    <path d="M-15 15 L25 50" stroke="#FFF" stroke-width="2" opacity="0.4" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(160, 105)">
    <text font-family="'Outfit', 'Inter', sans-serif" font-size="115" font-weight="950" fill="url(#premiumGold)" style="letter-spacing: -4px;" filter="url(#vectorGlow)">Planora</text>
    <text y="52" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#FFC107" style="letter-spacing: 14px; opacity: 0.85;">SMART EVENT OS</text>
  </g>
</svg>
